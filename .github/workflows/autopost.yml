name: Kamu İlan Otomatik Paylaşım Botu

on:
  schedule:
    # Her saat başı otomatik çalışır (Cron Job)
    - cron: '0 * * * *'
  workflow_dispatch: # İstediğinde GitHub paneli üzerinden manuel çalıştırmak için

jobs:
  build-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v3

      - name: Python Ortamını Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 Pillow

      - name: İlan Taramasını ve Paylaşımı Çalıştır
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: |
          python main.py

      - name: Paylaşılan İlan Geçmişini Güncelle ve Kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add paylasilanlar.json
          git commit -m "Chore: Paylaşılan ilan geçmişi güncellendi [skip ci]" || exit 0
          git push