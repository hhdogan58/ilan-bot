name: Kamu İlan Otomatik Paylaşım Botu

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir requests beautifulsoup4 Pillow curl_cffi

      - name: İlan Taramasını ve Paylaşımı Çalıştır
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: |
          python -u main.py

      - name: Paylaşılan İlan Geçmişini Güncelle ve Kaydet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f paylasilanlar.json ]; then
            git add paylasilanlar.json
            git commit -m "Chore: Paylaşılan ilan geçmişi güncellendi [skip ci]" || echo "Değişiklik yok"
            git push
          else
            echo "paylasilanlar.json henüz oluşturulmadı, atlanıyor."
          fi